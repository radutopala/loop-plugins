# Builds and tests every plugin and the template, and publishes a plugin's
# image when a tag <id>/v<version> is pushed. See the README's CI section.
name: plugins

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*/v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Panels on @loop/plugin-ui build against it from a Loop checkout next to
  # this repo; the Go SDK is a regular module. Set the LOOP_REF repository
  # variable to build against a branch or tag of Loop other than main.
  LOOP_REPOSITORY: radutopala/loop
  LOOP_REF: ${{ vars.LOOP_REF || 'main' }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: List the plugin dirs
        id: dirs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            dirs="plugins/${REF_NAME%%/v*}"
            if [ ! -f "$dirs/plugin.json" ]; then
              echo "::error::Tag $REF_NAME names no plugin: $dirs/plugin.json doesn't exist."
              exit 1
            fi
          else
            dirs=$(for f in plugins/*/plugin.json template/plugin.json; do [ -f "$f" ] && dirname "$f"; done)
          fi
          echo "dirs=$(printf '%s\n' "$dirs" | jq -Rcs 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  plugin:
    needs: discover
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    env:
      DIR: loop-plugins/${{ matrix.dir }}
    defaults:
      run:
        working-directory: loop-plugins/${{ matrix.dir }}
    steps:
      # This repo and Loop side by side, as a panel's file: dependency on
      # @loop/plugin-ui expects.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: loop-plugins
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.LOOP_REPOSITORY }}
          ref: ${{ env.LOOP_REF }}
          path: loop

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ env.DIR }}/go.mod
          cache-dependency-path: ${{ env.DIR }}/go.sum
      - name: Go vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: golangci-lint
        if: hashFiles(format('{0}/.golangci.yml', env.DIR)) != ''
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          working-directory: ${{ env.DIR }}
          args: --build-tags ui

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles(format('{0}/web/package-lock.json', env.DIR)) != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.DIR }}/web/package-lock.json
      - name: Web lint, typecheck, test and build
        if: hashFiles(format('{0}/web/package-lock.json', env.DIR)) != ''
        working-directory: ${{ env.DIR }}/web
        run: |
          npm ci
          npm run --if-present lint
          npm run --if-present typecheck
          npm run --if-present test
          npm run build

      # The UI conformance check (tests built with -tags ui, such as the
      # template's TestUI) loads the built panels in headless Chrome under
      # Loop's content security policy. Ubuntu's AppArmor keeps Chrome's
      # sandbox from starting unless unprivileged user namespaces are allowed.
      - name: UI conformance
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          go test -tags ui -run UI ./...

      # The image builds on every run; the publish job pushes it on a tag.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            plugin-ui=${{ github.workspace }}/loop/app/packages/plugin-ui
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dir }}

  # Only this job, which runs on a tag <id>/v<version> after the checks
  # pass, can write packages.
  publish:
    needs: [discover, plugin]
    if: github.ref_type == 'tag'
    name: publish ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    env:
      DIR: loop-plugins/${{ matrix.dir }}
    defaults:
      run:
        working-directory: loop-plugins/${{ matrix.dir }}
    steps:
      # This repo and Loop side by side, as a panel's file: dependency on
      # @loop/plugin-ui expects.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: loop-plugins
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.LOOP_REPOSITORY }}
          ref: ${{ env.LOOP_REF }}
          path: loop

      - name: Read the manifest
        id: manifest
        run: |
          read_field() { node "$GITHUB_WORKSPACE/loop-plugins/.github/scripts/manifest.mjs" plugin.json "$1"; }
          id=$(read_field id)
          version=$(read_field version)
          {
            echo "id=$id"
            echo "version=$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loop-plugin-$id"
          } >> "$GITHUB_OUTPUT"
      - name: Check the tag against the manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          ID: ${{ steps.manifest.outputs.id }}
          VERSION: ${{ steps.manifest.outputs.version }}
          MATRIX_DIR: ${{ matrix.dir }}
        run: |
          if [ "$REF_NAME" != "$ID/v$VERSION" ]; then
            echo "::error file=$MATRIX_DIR/plugin.json::Tag $REF_NAME doesn't match the manifest's id and version ($ID/v$VERSION)."
            exit 1
          fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION is already published; bump the version in plugin.json."
            exit 1
          fi
      - name: Build the image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            plugin-ui=${{ github.workspace }}/loop/app/packages/plugin-ui
          push: true
          provenance: false
          tags: |
            ${{ steps.manifest.outputs.image }}:${{ steps.manifest.outputs.version }}
            ${{ steps.manifest.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.manifest.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.dir }}

      - name: Check for the signing key
        id: signing
        env:
          KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Image not signed::COSIGN_PRIVATE_KEY isn't set, so $IMAGE@$DIGEST was pushed unsigned."
          fi
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: steps.signing.outputs.enabled == 'true'
      - name: Sign the image
        if: steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
