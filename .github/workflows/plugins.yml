# Builds and tests every plugin and the template, and publishes a plugin's
# image when a tag <id>/v<version> is pushed. See the README's CI section.
name: plugins

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*/v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List the plugin dirs
        id: dirs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            dirs="plugins/${REF_NAME%%/v*}"
            if [ ! -f "$dirs/plugin.json" ]; then
              echo "::error::Tag $REF_NAME names no plugin: $dirs/plugin.json doesn't exist."
              exit 1
            fi
          else
            dirs=$(for f in plugins/*/plugin.json template/plugin.json; do [ -f "$f" ] && dirname "$f"; done)
          fi
          echo "dirs=$(printf '%s\n' "$dirs" | jq -Rcs 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  plugin:
    needs: discover
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    # A panel on @radutopala/plugin-ui installs it from GitHub Packages.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    env:
      DIR: ${{ matrix.dir }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.DIR }}/go.mod
          cache-dependency-path: ${{ env.DIR }}/go.sum
      - name: Go vet and test
        run: |
          go vet ./...
          go test -race ./...
      - name: golangci-lint
        if: hashFiles(format('{0}/.golangci.yml', env.DIR)) != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ${{ env.DIR }}
          args: --build-tags ui

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles(format('{0}/web/package-lock.json', env.DIR)) != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.DIR }}/web/package-lock.json
      - name: Web lint, typecheck, test and build
        if: hashFiles(format('{0}/web/package-lock.json', env.DIR)) != ''
        working-directory: ${{ env.DIR }}/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run --if-present lint
          npm run --if-present typecheck
          npm run --if-present test
          npm run build

      # The UI conformance check (tests built with -tags ui, such as
      # cogtest's and the template's TestUI) loads the built panels and
      # cards in headless Chrome under Loop's content security policy.
      # Ubuntu's AppArmor keeps Chrome's sandbox from starting unless
      # unprivileged user namespaces are allowed.
      - name: UI conformance
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          go test -tags ui -run UI ./...

      # The image builds on every run; the publish job pushes it on a tag.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64,linux/arm64
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dir }}

  # Only this job, which runs on a tag <id>/v<version> after the checks
  # pass, can write packages.
  publish:
    needs: [discover, plugin]
    if: github.ref_type == 'tag'
    name: publish ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dirs) }}
    env:
      DIR: ${{ matrix.dir }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the manifest
        id: manifest
        run: |
          read_field() { node "$GITHUB_WORKSPACE/.github/scripts/manifest.mjs" plugin.json "$1"; }
          id=$(read_field id)
          version=$(read_field version)
          {
            echo "id=$id"
            echo "version=$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loop-plugin-$id"
          } >> "$GITHUB_OUTPUT"
      - name: Check the tag against the manifest
        env:
          REF_NAME: ${{ github.ref_name }}
          ID: ${{ steps.manifest.outputs.id }}
          VERSION: ${{ steps.manifest.outputs.version }}
          MATRIX_DIR: ${{ matrix.dir }}
        run: |
          if [ "$REF_NAME" != "$ID/v$VERSION" ]; then
            echo "::error file=$MATRIX_DIR/plugin.json::Tag $REF_NAME doesn't match the manifest's id and version ($ID/v$VERSION)."
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION is already published; bump the version in plugin.json."
            exit 1
          fi
      - name: Build the image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.DIR }}
          platforms: linux/amd64,linux/arm64
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: true
          provenance: false
          tags: |
            ${{ steps.manifest.outputs.image }}:${{ steps.manifest.outputs.version }}
            ${{ steps.manifest.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.manifest.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.dir }}

      - name: Check for the signing key
        id: signing
        env:
          KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Image not signed::COSIGN_PRIVATE_KEY isn't set, so $IMAGE@$DIGEST was pushed unsigned."
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.signing.outputs.enabled == 'true'
      - name: Sign the image
        if: steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
