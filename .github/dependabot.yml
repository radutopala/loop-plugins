version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directories: ["/plugins/*", "/template"]
    schedule:
      interval: monthly
    # Loop's SDK moves with Loop's releases, not on a schedule.
    ignore:
      - dependency-name: github.com/radutopala/loop/pluginsdk
  # No npm entry: every panel installs @radutopala/plugin-ui from GitHub
  # Packages, which would take a token in a Dependabot secret.
