version: 2
# GitHub Packages wants a token even for public packages:
# GH_PACKAGES_TOKEN is a Dependabot secret holding a classic token with only
# read:packages.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.GH_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directories: ["/plugins/*", "/template"]
    schedule:
      interval: monthly
    # Loop's SDK moves with Loop's releases, not on a schedule.
    ignore:
      - dependency-name: github.com/radutopala/loop/pluginsdk
  - package-ecosystem: npm
    directories: ["/plugins/*/web"]
    registries: [github-packages]
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /template/web
    registries: [github-packages]
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    # typescript-eslint supports TypeScript only up to 6.0.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
